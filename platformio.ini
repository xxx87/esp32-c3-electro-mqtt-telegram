; PlatformIO Project Configuration File
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Serial Monitor baud rate (must match Serial.begin)
monitor_speed = 115200

; Upload speed over USB (lower if uploads fail: 460800 / 115200)
upload_speed = 921600

; ESP32-C3 SuperMini uses native USB CDC for Serial
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; External libraries (PlatformIO downloads them automatically)
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
    witnessmenow/UniversalTelegramBot@^1.3.0
    tzapu/WiFiManager@^2.0.17

; Keep compile_commands.json fresh for clangd IntelliSense
; After changing env/board/libs: PlatformIO: Rebuild IntelliSense Index
; or: pio run -t compiledb

; OTA upload over Wi-Fi (device must already run this firmware)
; 1) Look up hostname in Serial: "Hostname: ESP32-C3-XXXXXX"
; 2) Set upload_port below to hostname.local OR device IP
; 3) pio run -e esp32-c3-supermini-ota -t upload
[env:esp32-c3-supermini-ota]
extends = env:esp32-c3-supermini
upload_protocol = espota
; upload_port = ESP32-C3-FC98BA.local
upload_port = 192.168.30.130
